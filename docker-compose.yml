name: rifas

services:
  postgres:
    image: postgres:17-alpine
    container_name: rifas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rifas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rifas_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rifas}
      # Deterministic collation, independent of the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rifas} -d ${POSTGRES_DB:-rifas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    container_name: rifas-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula

volumes:
  postgres-data:
    name: rifas-postgres-data
